    <style>
        :root {
            --icu-base: #1e1e2e;
            --icu-mantle: #181825;
            --icu-surface-0: #313244;
            --icu-surface-1: #45475a;
            --icu-text: #cdd6f4;
            --icu-muted: #9399b2;
            --icu-accent: #89b4fa;
            --icu-error: #f38ba8;
            --icu-shadow: rgba(17, 17, 27, 0.45);
        }

        @media (prefers-color-scheme: light) {
            :root {
                --icu-base: #eff1f5;
                --icu-mantle: #ffffff;
                --icu-surface-0: #e6e9ef;
                --icu-surface-1: #dce0e8;
                --icu-text: #4c4f69;
                --icu-muted: #7c7f93;
                --icu-accent: #1e66f5;
                --icu-error: #d20f39;
                --icu-shadow: rgba(76, 79, 105, 0.14);
            }
        }

        html {
            touch-action: manipulation;
        }

        body {
            background: var(--icu-base);
            color: var(--icu-text);
        }

        /* Allow canvas to fill entire web page: */
        html,
        body {
            overflow: hidden;
            margin: 0 !important;
            padding: 0 !important;
            height: 100%;
            width: 100%;
        }

        /* Make canvas fill entire document: */
        canvas {
            margin-right: auto;
            margin-left: auto;
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .centered {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }

        #web-loader {
            width: min(320px, calc(100vw - 48px));
            padding: 22px 24px 20px;
            border: 1px solid var(--icu-surface-1);
            border-radius: 8px;
            background: color-mix(in srgb, var(--icu-mantle) 92%, transparent);
            box-shadow: 0 18px 44px var(--icu-shadow);
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .loader-logo {
            margin-bottom: 18px;
            color: var(--icu-accent);
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 0.14em;
            line-height: 1;
            text-shadow: 0 0 22px color-mix(in srgb, var(--icu-accent) 45%, transparent);
        }

        #wasm-progress {
            display: block;
            width: 100%;
            height: 8px;
            border: 0;
            border-radius: 4px;
            overflow: hidden;
            background: var(--icu-surface-0);
            color: var(--icu-accent);
            appearance: none;
        }

        #wasm-progress::-webkit-progress-bar {
            border-radius: 4px;
            background: var(--icu-surface-0);
        }

        #wasm-progress::-webkit-progress-value {
            border-radius: 4px;
            background: var(--icu-accent);
            transition: width 180ms ease;
        }

        #wasm-progress::-moz-progress-bar {
            border-radius: 4px;
            background: var(--icu-accent);
            transition: width 180ms ease;
        }

        #wasm-progress:indeterminate {
            background:
                linear-gradient(90deg, transparent 0%, var(--icu-accent) 48%, transparent 100%),
                var(--icu-surface-0);
            background-size: 42% 100%, 100% 100%;
            background-position: -42% 0, 0 0;
            animation: loader-pulse 1.15s ease-in-out infinite;
        }

        #wasm-progress:indeterminate::-webkit-progress-bar {
            background: transparent;
        }

        #wasm-progress:indeterminate::-webkit-progress-value {
            background: transparent;
        }

        #wasm-progress:indeterminate::-moz-progress-bar {
            background: transparent;
        }

        #wasm-status {
            min-height: 16px;
            margin-top: 10px;
            color: var(--icu-muted);
            font-size: 12px;
            line-height: 16px;
        }

        #web-loader.is-error #wasm-status {
            color: var(--icu-error);
        }

        #web-loader.is-complete .loader-logo {
            text-shadow: 0 0 28px color-mix(in srgb, var(--icu-accent) 55%, transparent);
        }

        @keyframes loader-pulse {
            0% {
                background-position: -42% 0, 0 0;
            }

            100% {
                background-position: 142% 0, 0 0;
            }
        }
    </style>
